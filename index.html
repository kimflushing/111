<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Little Loaf — 숲속 베이커리</title>
<style>
  :root { --cream:#fff8e9; --ink:#493d31; --leaf:#6f9661; --pink:#e9a9a0; --gold:#e8bd70; }
  * { box-sizing:border-box; }
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#dce9ce; color:var(--ink); font-family:ui-rounded,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; touch-action:none; }
  #game { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; }
  .topbar { position:absolute; top:env(safe-area-inset-top, 0px); left:0; right:0; padding:12px 14px; display:flex; justify-content:space-between; align-items:flex-start; gap:8px; pointer-events:none; }
  .brand,.stats,.hint,.panel,.controls button,.action { border:1px solid rgba(104,82,58,.14); box-shadow:0 4px 14px rgba(62,73,48,.12); }
  .brand { background:rgba(255,248,233,.92); border-radius:18px; padding:9px 12px; font-weight:900; font-size:14px; pointer-events:auto; }
  .brand small { display:block; font-size:10px; font-weight:600; opacity:.7; margin-top:2px; }
  .stats { background:rgba(255,248,233,.92); border-radius:16px; padding:8px 11px; font-size:12px; line-height:1.7; text-align:right; pointer-events:auto; }
  .hint { position:absolute; left:50%; top:78px; transform:translateX(-50%); width:max-content; max-width:88vw; text-align:center; border-radius:14px; padding:8px 12px; background:rgba(255,248,233,.92); font-size:12px; pointer-events:none; }
  .controls { position:absolute; bottom:calc(18px + env(safe-area-inset-bottom, 0px)); left:14px; display:grid; grid-template-columns:48px 48px 48px; grid-template-rows:48px 48px; gap:5px; }
  .controls button { border-radius:16px; background:rgba(255,248,233,.88); color:var(--ink); font-size:20px; font-weight:800; touch-action:none; }
  .controls .up { grid-column:2; grid-row:1; } .controls .left { grid-column:1; grid-row:2; } .controls .down { grid-column:2; grid-row:2; } .controls .right { grid-column:3; grid-row:2; }
  .actions { position:absolute; bottom:calc(22px + env(safe-area-inset-bottom, 0px)); right:14px; display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
  .action { border:0; border-radius:18px; padding:12px 15px; min-width:120px; color:#fffdf6; background:#66885b; font-size:13px; font-weight:900; touch-action:manipulation; }
  .action.secondary { background:#c98c77; } .action.gold { background:#b58b4e; }
  .panel { position:absolute; display:none; left:50%; top:50%; transform:translate(-50%,-50%); width:min(340px, calc(100vw - 30px)); max-height:76vh; overflow:auto; border-radius:24px; padding:18px; background:rgba(255,248,233,.98); }
  .panel.open { display:block; }
  .panel h2 { margin:0 0 6px; font-size:21px; } .panel p { margin:0 0 14px; font-size:13px; line-height:1.5; }
  .items { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .item { border:1px solid #e8dac1; border-radius:15px; background:#fffdf7; padding:11px 8px; color:var(--ink); font:inherit; text-align:left; min-height:62px; }
  .item b { display:block; font-size:13px; margin-bottom:3px; } .item span { font-size:11px; opacity:.75; }
  .close { margin-top:12px; width:100%; border:0; border-radius:14px; background:#e9ddc7; padding:11px; color:var(--ink); font-weight:800; font-size:14px; }
  #toast { position:absolute; left:50%; bottom:calc(150px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); padding:10px 14px; border-radius:14px; background:rgba(73,61,49,.9); color:white; font-size:12px; text-align:center; max-width:88vw; opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.show { opacity:1; }
  @media (min-width:700px) { .controls { left:24px; bottom:24px; } .actions { right:24px; bottom:24px; } .hint { top:82px; } }
</style>
</head>
<body>
<div id="game"></div>
<div class="topbar">
  <div class="brand">🥐 LITTLE LOAF <small>숲속 작은 베이커리</small></div>
  <div class="stats">🪙 <b id="coins">30</b><br>🌾 <b id="wheat">2</b>　🍓 <b id="berries">2</b><br>🍞 <b id="bread">0</b></div>
</div>
<div class="hint" id="hint">화살표로 이동해 봐! 베이커리 근처에서 빵을 구울 수 있어 🌿</div>
<div class="controls" aria-label="이동 조작">
  <button class="up" data-dir="up" aria-label="앞으로">▲</button>
  <button class="left" data-dir="left" aria-label="왼쪽">◀</button>
  <button class="down" data-dir="down" aria-label="뒤로">▼</button>
  <button class="right" data-dir="right" aria-label="오른쪽">▶</button>
</div>
<div class="actions">
  <button class="action" id="farmBtn">🌱 농사짓기</button>
  <button class="action secondary" id="bakeBtn">🥖 베이킹</button>
  <button class="action gold" id="animalBtn">🐔 동물 돌보기</button>
</div>
<div class="panel" id="panel" role="dialog" aria-modal="true">
  <h2 id="panelTitle">작은 농장</h2><p id="panelDesc"></p><div class="items" id="items"></div><button class="close" id="closePanel">닫기</button>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function(){
  const root = document.getElementById('game');
  if (!window.THREE) {
    root.innerHTML = '<div style="padding:30px;font:16px sans-serif">3D 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.</div>';
    return;
  }
  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#dce9ce');
  scene.fog = new THREE.Fog('#dce9ce', 22, 48);
  const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, .1, 100);
  camera.position.set(0, 10, 13);
  const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.7));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  root.appendChild(renderer.domElement);
  scene.add(new THREE.HemisphereLight(0xfff4d9, 0x82956b, 2.0));
  const sun = new THREE.DirectionalLight(0xffefcf, 2.3);
  sun.position.set(-7, 13, 8); sun.castShadow=true; sun.shadow.mapSize.set(1024,1024); scene.add(sun);
  const mat = (color, roughness=1) => new THREE.MeshStandardMaterial({color, roughness, flatShading:true});
  const materials = {
    grass:mat('#a8c78a'), path:mat('#d9c6a0'), wood:mat('#9b6b49'), darkWood:mat('#76503a'),
    cream:mat('#f4dfb7'), roof:mat('#b86f59'), leaf:mat('#6f9661'), leaf2:mat('#8cae70'),
    flower:mat('#f5d9dd'), yellow:mat('#f2d47c'), soil:mat('#987957'), wheat:mat('#e3c36d'),
    red:mat('#d96f68'), white:mat('#fff4dc'), black:mat('#493d31'), green:mat('#628b52')
  };
  function box(w,h,d, material, x,y,z, parent=scene) {
    const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
    mesh.position.set(x,y,z); mesh.castShadow=true; mesh.receiveShadow=true; parent.add(mesh); return mesh;
  }
  function sphere(r, material,x,y,z,parent=scene, sx=1,sy=1,sz=1) {
    const mesh=new THREE.Mesh(new THREE.IcosahedronGeometry(r,1),material);
    mesh.position.set(x,y,z); mesh.scale.set(sx,sy,sz); mesh.castShadow=true; parent.add(mesh); return mesh;
  }
  function cylinder(rt,rb,h,material,x,y,z,parent=scene, sides=7) {
    const mesh=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,sides),material);
    mesh.position.set(x,y,z); mesh.castShadow=true; mesh.receiveShadow=true; parent.add(mesh); return mesh;
  }
  // Meadow and path
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(44,44),materials.grass);
  ground.rotation.x=-Math.PI/2; ground.position.y=-.08; ground.receiveShadow=true; scene.add(ground);
  box(4.8,.035,24,materials.path,1.5,.01,2);
  box(14,.04,3.2,materials.path,0,.015,1.4);
  // Flower tufts
  for(let i=0;i<75;i++){
    const x=(Math.random()-.5)*38, z=(Math.random()-.5)*36;
    if(Math.abs(x)<4 && z>-5 && z<7) continue;
    const stem=cylinder(.025,.035,.28,materials.green,x,.12,z,scene,5);
    sphere(.09, i%3===0?materials.flower:(i%3===1?materials.yellow:materials.white),x,.32,z,scene,1,.8,1);
  }
  function tree(x,z,scale=1){
    cylinder(.18*scale,.28*scale,1.2*scale,materials.wood,x,.6*scale,z);
    sphere(.95*scale,materials.leaf,x,.95*scale,z,scene,1,1.05,1);
    sphere(.62*scale,materials.leaf2,x-.35*scale,1.35*scale,z+.08*scale);
    sphere(.6*scale,materials.leaf,x+.36*scale,1.42*scale,z-.05*scale);
  }
  for(let i=0;i<30;i++){
    let x,z; do {x=(Math.random()-.5)*38;z=(Math.random()-.5)*36;} while(Math.abs(x)<7&&z>-7&&z<8);
    tree(x,z,.7+Math.random()*.65);
  }
  // Cottage and bakery
  function cottage(x,z, bakery=false){
    const g=new THREE.Group(); g.position.set(x,0,z); scene.add(g);
    box(3.4,2.2,2.8, bakery?materials.cream:materials.cream,0,1.1,0,g);
    // roof two sloped-ish roof panels
    const r1=box(2.05,.22,3.2,materials.roof,-.78,2.35,0,g); r1.rotation.z=-.55;
    const r2=box(2.05,.22,3.2,materials.roof,.78,2.35,0,g); r2.rotation.z=.55;
    box(.65,1.15,.12,materials.darkWood,0,.58,1.42,g);
    box(.68,.72,.09,materials.wood,-1.05,1.35,1.43,g);
    box(.68,.72,.09,materials.wood,1.05,1.35,1.43,g);
    box(.48,.52,.1,materials.cream,-1.05,1.35,1.5,g);
    box(.48,.52,.1,materials.cream,1.05,1.35,1.5,g);
    if(bakery){
      box(1.2,.28,.18,materials.darkWood,0,2.85,1.2,g);
      // striped awning
      for(let i=0;i<5;i++) box(.42,.32,.12,i%2?materials.white:materials.red,-.84+i*.42,2.53,1.45,g);
      box(1.05,.55,.12,materials.darkWood,0,1.55,1.49,g);
      box(.9,.4,.06,materials.white,0,1.56,1.57,g);
      sphere(.18,materials.yellow,1.6,2.05,.25,g);
    }
    return g;
  }
  cottage(-5,-3,false);
  const bakery=cottage(4,-3,true);
  // garden plots
  const plots=[];
  for(let row=0;row<2;row++) for(let col=0;col<3;col++){
    const x=-5.8+col*1.5, z=3+row*1.45;
    box(1.28,.12,1.18,materials.soil,x,.04,z);
    const crop=sphere(.16,materials.green,x,.24,z,scene,.8,1.4,.8); crop.visible=false;
    const plot={x,z,stage:0,crop,kind:'밀'};
    plots.push(plot);
    // little border stakes
    for(let k=0;k<4;k++) box(.08,.16,.08,materials.wood,x+(k<2?-.65:.65),.13,z+(k%2?-.6:.6));
  }
  // strawberry patch
  const berryPatches=[];
  for(let i=0;i<4;i++){
    const x=-6+i*.55,z=6.5;
    const plant=sphere(.22,materials.green,x,.22,z,scene,1.3,.65,1.1);
    const berry=sphere(.09,materials.red,x+.05,.38,z,scene,1,.8,1); 
    berryPatches.push({plant,berry,ready:true});
  }
  // fence
  for(let i=0;i<8;i++){ box(.12,.55,.12,materials.wood,-7,.27,2+i*.72); if(i<7) box(.12,.1,.72,materials.cream,-7,.45,2.36+i*.72); }
  // Animals
  function chicken(x,z){
    const g=new THREE.Group(); g.position.set(x,0,z); scene.add(g);
    sphere(.32,materials.white,0,.38,0,g,1.1,.9,.9);
    sphere(.22,materials.white,.16,.64,.03,g,1,.95,1);
    sphere(.045,materials.black,.34,.68,.12,g);
    const beak=cylinder(0,.09,.16,materials.yellow,.42,.62,.08,g,5); beak.rotation.z=-Math.PI/2;
    sphere(.08,materials.red,.14,.87,.02,g,1,.7,1);
    cylinder(.035,.04,.25,materials.yellow,-.08,.13,0,g,5);
    cylinder(.035,.04,.25,materials.yellow,.08,.13,0,g,5);
    return g;
  }
  const hen=chicken(-7,5.8);
  const chick=chicken(-6.4,5.1); chick.scale.setScalar(.65);
  function cow(x,z){
    const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
    box(.95,.62,.55,materials.white,0,.65,0,g);
    sphere(.3,materials.white,.52,.82,.02,g,1,.9,.9);
    sphere(.07,materials.black,.72,.86,.18,g);
    sphere(.07,materials.black,.72,.86,-.13,g);
    sphere(.14,materials.black,-.18,.88,.28,g,1,.8,.5);
    for(const lx of [-.3,.3]) for(const lz of [-.18,.18]) cylinder(.055,.07,.42,materials.white,lx,.22,lz,g,5);
    return g;
  }
  const cowObj=cow(7,3.5);
  // player
  const player=new THREE.Group(); scene.add(player); player.position.set(0,0,5.5);
  sphere(.28,mat('#e8b18e'),0,1.02,0,player,1,.95,.9);
  // hair cap
  sphere(.29,mat('#72513b'),0,1.17,-.045,player,1,.5,1);
  box(.42,.48,.34,mat('#d98e83'),0,.55,0,player);
  box(.13,.36,.14,mat('#f2d5b7'),-.15,.14,0,player);
  box(.13,.36,.14,mat('#f2d5b7'),.15,.14,0,player);
  // backpack
  box(.18,.27,.12,mat('#9eac78'),0,.58,-.22,player);
  // inventory
  const state={coins:30,wheat:2,berries:2,bread:0,eggs:0,milk:0,planted:0};
  const $=id=>document.getElementById(id);
  function updateStats(){ $('coins').textContent=state.coins; $('wheat').textContent=state.wheat; $('berries').textContent=state.berries; $('bread').textContent=state.bread; }
  let toastTimer;
  function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200);}
  function openPanel(title,desc,items){
    $('panelTitle').textContent=title;$('panelDesc').textContent=desc;
    const host=$('items');host.innerHTML='';
    items.forEach(it=>{const b=document.createElement('button');b.className='item';b.innerHTML='<b>'+it.name+'</b><span>'+it.info+'</span>';b.addEventListener('click',()=>it.run());host.appendChild(b);});
    $('panel').classList.add('open');
  }
  $('closePanel').addEventListener('click',()=>$('panel').classList.remove('open'));
  function near(x,z,dist=4){return Math.hypot(player.position.x-x,player.position.z-z)<dist;}
  $('farmBtn').addEventListener('click',()=>{
    const plot=plots.find(p=>Math.hypot(player.position.x-p.x,player.position.z-p.z)<2.3);
    const nearBerry=Math.hypot(player.position.x+5,player.position.z-6.5)<3;
    if(plot){
      if(plot.stage===0){
        openPanel('🌱 작은 텃밭','무엇을 심어 볼까?',[
          {name:'🌾 밀 씨앗',info:'씨앗 1개 · 무료 체험',run:()=>{plot.stage=1;plot.kind='밀';plot.crop.material=materials.wheat;plot.crop.visible=true;plot.crop.scale.set(.7,.8,.7);$('panel').classList.remove('open');toast('밀을 심었어! 시간이 지나면 자라 🌾');}},
          {name:'🍓 딸기 모종',info:'딸기 1개 · 2코인',run:()=>{if(state.coins<2){toast('코인이 부족해!');return;}state.coins-=2;plot.stage=1;plot.kind='딸기';plot.crop.material=materials.red;plot.crop.visible=true;plot.crop.scale.set(.8,.8,.8);updateStats();$('panel').classList.remove('open');toast('딸기 모종을 심었어!');}}
        ]);
      } else if(plot.stage===1){
        plot.stage=2;plot.crop.scale.set(1.15,1.65,1.15);plot.crop.position.y=.34;toast(plot.kind+'가 쑥쑥 자랐어! 다시 누르면 수확할 수 있어 🌿');
      } else {
        if(plot.kind==='밀'){state.wheat+=2;}else{state.berries+=2;}
        plot.stage=0;plot.crop.visible=false;plot.crop.position.y=.24;updateStats();toast(plot.kind+' 수확 성공! 가방에 넣었어 🎉');
      }
    } else if(nearBerry){
      if(state.berries>0){state.berries+=1;updateStats();toast('야생 딸기를 하나 찾았어! 🍓');}else toast('여기엔 딸기가 더 없어.');
    } else toast('텃밭 가까이 가서 눌러 줘! 🌱');
  });
  $('bakeBtn').addEventListener('click',()=>{
    if(!near(4,-3,5.5)){toast('베이커리 앞까지 걸어가 줘! 🥖');return;}
    openPanel('🥐 오늘의 베이킹','재료를 모아 맛있는 빵을 만들어 보자!',[
      {name:'🍞 시골 식빵',info:'밀 2개 · 판매가 8코인',run:()=>{if(state.wheat<2){toast('밀이 부족해! 텃밭에서 수확해 줘.');return;}state.wheat-=2;state.bread++;state.coins+=8;updateStats();$('panel').classList.remove('open');toast('따끈한 식빵 완성! 팔아서 8코인을 벌었어 🍞');}},
      {name:'🍓 딸기 타르트',info:'밀 1개 + 딸기 2개 · 14코인',run:()=>{if(state.wheat<1||state.berries<2){toast('밀 1개와 딸기 2개가 필요해!');return;}state.wheat--;state.berries-=2;state.bread++;state.coins+=14;updateStats();$('panel').classList.remove('open');toast('예쁜 딸기 타르트 완성! 14코인 획득 🍓');}},
      {name:'🥐 버터 크루아상',info:'밀 2개 · 판매가 11코인',run:()=>{if(state.wheat<2){toast('밀이 부족해!');return;}state.wheat-=2;state.bread++;state.coins+=11;updateStats();$('panel').classList.remove('open');toast('겹겹이 바삭한 크루아상 완성! 🥐');}}
    ]);
  });
  $('animalBtn').addEventListener('click',()=>{
    if(!near(-6.7,5.5,4)&&!near(7,3.5,4)){toast('닭이나 소 가까이 가서 눌러 줘! 🐔');return;}
    openPanel('🐔 동물 돌보기','동물들을 잘 돌보면 농장에 필요한 재료를 얻을 수 있어.',[
      {name:'🌾 닭에게 먹이 주기',info:'3코인 · 달걀 얻기',run:()=>{if(state.coins<3){toast('코인이 부족해!');return;}state.coins-=3;state.eggs++;updateStats();$('panel').classList.remove('open');toast('꼬꼬에게 먹이를 줬어! 달걀 +1 🥚');}},
      {name:'🥛 젖소 돌보기',info:'4코인 · 우유 얻기',run:()=>{if(state.coins<4){toast('코인이 부족해!');return;}state.coins-=4;state.milk++;updateStats();$('panel').classList.remove('open');toast('소를 돌봤어! 신선한 우유 +1 🥛');}},
      {name:'💗 쓰다듬기',info:'무료 · 애정도 올리기',run:()=>{$('panel').classList.remove('open');toast('쓰담쓰담… 동물들이 행복해 보여! 💗');}}
    ]);
  });
  // Movement
  const keys={up:false,down:false,left:false,right:false};
  document.querySelectorAll('[data-dir]').forEach(btn=>{
    const dir=btn.dataset.dir;
    const on=e=>{e.preventDefault();keys[dir]=true;};
    const off=e=>{e.preventDefault();keys[dir]=false;};
    btn.addEventListener('pointerdown',on);btn.addEventListener('pointerup',off);btn.addEventListener('pointercancel',off);btn.addEventListener('pointerleave',off);
  });
  window.addEventListener('keydown',e=>{if(['ArrowUp','w','W'].includes(e.key))keys.up=true;if(['ArrowDown','s','S'].includes(e.key))keys.down=true;if(['ArrowLeft','a','A'].includes(e.key))keys.left=true;if(['ArrowRight','d','D'].includes(e.key))keys.right=true;});
  window.addEventListener('keyup',e=>{if(['ArrowUp','w','W'].includes(e.key))keys.up=false;if(['ArrowDown','s','S'].includes(e.key))keys.down=false;if(['ArrowLeft','a','A'].includes(e.key))keys.left=false;if(['ArrowRight','d','D'].includes(e.key))keys.right=false;});
  let last=performance.now();
  function animate(now){
    requestAnimationFrame(animate);
    const dt=Math.min((now-last)/1000,.05);last=now;
    if(!$('panel').classList.contains('open')){
      let dx=(keys.right?1:0)-(keys.left?1:0), dz=(keys.down?1:0)-(keys.up?1:0);
      if(dx||dz){const len=Math.hypot(dx,dz);dx/=len;dz/=len;player.position.x+=dx*3.4*dt;player.position.z+=dz*3.4*dt;player.rotation.y=Math.atan2(dx,dz);}
    }
    player.position.x=THREE.MathUtils.clamp(player.position.x,-18,18);player.position.z=THREE.MathUtils.clamp(player.position.z,-17,17);
    const target=new THREE.Vector3(player.position.x,0,player.position.z);
    camera.position.x+=(player.position.x*.55-camera.position.x)*.06;
    camera.position.z+=(player.position.z+11-camera.position.z)*.06;
    camera.lookAt(target.x,0,target.z);
    hen.position.x=-7+Math.sin(now*.0007)*.25; chick.position.z=5.1+Math.cos(now*.001)*.2;
    renderer.render(scene,camera);
  }
  requestAnimationFrame(animate);
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));});
  updateStats();
  setTimeout(()=>toast('화살표로 이동하고, 가까이 가서 농사·베이킹·동물 버튼을 눌러 봐! 🌷'),700);
})();
</script>
